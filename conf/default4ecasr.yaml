###########################
#  adintool-like options
###########################
in: mic
out: file #adinnet
filename: result/%Y%m%d_%R.wav
startid: 0
server: localhost
port: 5530
freq: 16000
nch: 2
tgt_chs: [0, 1]

##########################
#       pyadintool
##########################
device: default

enable_logsave: False
logfilefmt: _logs/%Y%m%d/log_%Y%m%d%H%M%S.log

enable_rawsave: False
rawfilefmt: raw/%Y%m%d/record_%u_%R_%H%M%S.wav
rotate_min: 30

enable_timestamp: False
timestampfile: timestamp.lab

enable_plot: False

##########################
#   model descriptions
##########################
# echo canceller
enable_ec: True
lms:
  L: 512
  mu: 0.0
  filterfile: conf/ecfilter.txt
  floorfile: #conf/ecfloor.txt # comment out if you add noise for flooring.

# voice activity detection
tagger:
  package: pyadin.fdvad
  class: stftSlidingVAD
  params:
    dnnhmmconf:
      probfilter:
        classname: BinaryProbFilter
        package: pyadin.fdvad
        params:
          trp1_self: 0.99
          trp2_self: 0.99
          pw_1: 0.5
      classifier:
        classname: SITEVoiceClassifierV2
        package: pyadin.nn
        path: ouktlab/pyadintool-fdvad-SITEVoiceClassifierV2-l
      n_bwd: 50
      n_fwd: 0
      n_offset: 20
    min_frame: 2
    nshift: 160
    nbuffer: 12000
    device: cpu
    dtype: float32
    nthread: 3
    #min_thre: 1.0

# post processing
postproc:
  package: pyadin.tdvad
  class: PostProc
  params:
    freq: 16000
    margin_begin: 0.20
    margin_end: 0.20
    shift_time: 0.23

#
plotwin:
  nbuffer: 800
  selects: [2, 3]
  nsample: 32000
  nch: 3
  nskip: 10
  scale: 1.0
